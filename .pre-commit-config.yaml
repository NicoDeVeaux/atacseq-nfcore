repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.8.3
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*ro-crate-metadata.json$|
              modules/(?!local/).*|
              subworkflows/(?!local/).*|
              .*\.snap$
          )$
  - repo: https://github.com/seqeralabs/nf-lint-pre-commit
    rev: v0.3.0
    hooks:
      - id: nextflow-lint
        files: '\.nf$|nextflow\.config$'
        args: ["-output", "json"]
  - repo: local
    hooks:
      - id: patched-module-snapshots
        name: Patched nf-core modules agree with their test snapshots
        entry: tests/bin/check_patched_module_snapshots.py
        language: python
        pass_filenames: false
        files: '^(modules\.json|modules/nf-core/.*)$'
